<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhúng Youtube</title>
</head>
<style>
    body{
        font-family : Arial , sans-serif;
        text-align :center;
        background : green;
    }
    .container{
        width:70%;
        margin : auto;
        padding : 10px;
        border : 2px solid blue;
        background : white;
    }
    audio,video,iframe{
        margin-top:15px;
    }
    h2{
        margin-top : 20px;
    }
</style>
<body>
    <div class="container">
        <h2>Audio Player</h2>
        <audio controls><source src="audio.mp3" type="audio/mpeg"> Trình duyệt không hỗ trợ audio.</audio>
        <!-- controls : hiện nút play / pause , thanh âm lượng , tua -->
        <video width ="500" controls>
            <source src="video.mp4" type ="video.mp4">
            Trình duyệt không hỗ trợ video
        </video>
        <h2>Youtube Video</h2>
        <iframe width="560" height="315" 
        src="https://www.youtube.com/embed/vlybnec0TDo?si=XtaqgaDtDt9Njbj7" 
        title="YouTube video player" 
        frameborder="0" 
        allowfullscreen></iframe>
    </div>
</body>
</html>
